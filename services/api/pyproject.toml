[project]
name = "trackflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator==2.2.0",
    "fastapi==0.116.1",
    "pydantic>=2.11,<3",
    "tinydb==4.8.2",
    "uvicorn==0.35.0",
]

[project.scripts]
seed = "seed:main"
seed-100 = "seed_100:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["database", "main", "models", "seed", "seed_100", "seed_data"]
packages = ["routes"]